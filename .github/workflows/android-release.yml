name: Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" package that this action installs by
          # default, so it now fails unconditionally with "Failed to find package
          # 'tools'" unless we override it. platform-tools is the only piece we
          # actually need here — Gradle's Android plugin downloads the specific
          # platform/build-tools versions itself during the build.
          packages: "platform-tools"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kst-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Read version name
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: v${{ steps.version.outputs.version_name }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout u2mkst/home
        uses: actions/checkout@v4
        with:
          repository: u2mkst/home
          token: ${{ secrets.HOME_REPO_PAT }}
          path: home-repo

      - name: Publish apk to u2mkst/home
        run: |
          cp app/build/outputs/apk/release/app-release.apk home-repo/kst.apk
          cd home-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kst.apk
          if git diff --cached --quiet; then
            echo "kst.apk unchanged, skipping commit"
          else
            git commit -m "Update kst.apk to v${{ steps.version.outputs.version_name }}"
            git push
          fi
